[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-demo"
version = "0.1.0"
description = "Incremental agent engineering learning project"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "google-genai>=2.29,<3",
    "langchain>=1.4,<2",
    "langchain-google-genai>=4.4,<5",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.14,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
